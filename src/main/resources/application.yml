server:
  port: 8080
  servlet:
    context-path: /your-summoner
  compression:
    enabled: true
  error:
    include-stacktrace: never

spring:
  jackson:
    deserialization:
      # Riot omits fields at times; Jackson 3 would otherwise reject a missing primitive.
      fail-on-null-for-primitives: false
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/yoursummoner}
  mvc:
    problemdetails:
      enabled: true

riot:
  api:
    token: ${RIOT_API_KEY:}
    base-url-template: https://{host}.api.riotgames.com
    connect-timeout: 2s
    read-timeout: 4s
  resilience:
    # Prazo total da operação, somando as novas tentativas (ADR 0002 (d)); deve ser > 0.
    total-deadline: 7s

ddragon:
  url: https://ddragon.leagueoflegends.com
  resilience:
    total-deadline: 12s

cdragon:
  url: https://raw.communitydragon.org

resilience4j:
  retry:
    instances:
      ddragon:
        max-attempts: 3
        wait-duration: 250ms
        retry-exception-predicate: com.your.summoner.infrastructure.adapter.out.RetryableFailure
      cdragon:
        max-attempts: 3
        wait-duration: 250ms
        retry-exception-predicate: com.your.summoner.infrastructure.adapter.out.RetryableFailure
  circuitbreaker:
    instances:
      ddragon:
        record-exception-predicate: com.your.summoner.infrastructure.adapter.out.RetryableFailure
      cdragon:
        record-exception-predicate: com.your.summoner.infrastructure.adapter.out.RetryableFailure

yoursummoner:
  default-platform: BR1
  locale: pt_BR
  patch-sync:
    cron: "0 0 * * * *"
    enabled: true
    lock-stale-after: 15m
  # Admin area and secret vault (docs/admin.md). Empty values keep the admin area off (503).
  master-key: ${YOURSUMMONER_MASTER_KEY:}
  admin:
    user: ${YOURSUMMONER_ADMIN_USER:}
    password-hash: ${YOURSUMMONER_ADMIN_PASSWORD_HASH:}
    allowed-cidrs: 127.0.0.1/32,::1/128

springdoc:
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: YourSummoner-API
    version: 3.0.0

logging:
  level:
    com.your.summoner: INFO
